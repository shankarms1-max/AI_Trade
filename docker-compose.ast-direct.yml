# Isolated AST_FUTURES_V1_DIRECT PAPER research stack. Its own database, network and volumes.
# It never connects to the ACTS production database and has no order capability.
#   docker compose -f docker-compose.ast-direct.yml --env-file .env.ast-direct up -d --build
name: ast-direct-paper

x-ast-direct: &ast-direct
  build:
    context: .
    dockerfile: backend/Dockerfile
  image: ast-direct-paper:${AST_DIRECT_IMAGE_TAG:-local}
  env_file:
    - path: .env.ast-direct
      required: true
  environment:
    APP_ENV: research
    TZ: Asia/Kolkata
    DATABASE_URL: postgresql+psycopg://${AST_DIRECT_POSTGRES_USER:?set}:${AST_DIRECT_POSTGRES_PASSWORD:?set}@ast-direct-postgres:5432/${AST_DIRECT_POSTGRES_DB:?set}
    LOG_DIR: /app/logs
    AST_DIRECT_HEARTBEAT_FILE: /app/logs/ast_direct_worker.heartbeat.json
    AST_DIRECT_KILL_SWITCH_FILE: /app/control/KILL
  networks:
    - ast_direct
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  ast-direct-postgres:
    image: postgres:16-alpine
    container_name: ast-direct-paper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AST_DIRECT_POSTGRES_DB:?set}
      POSTGRES_USER: ${AST_DIRECT_POSTGRES_USER:?set}
      POSTGRES_PASSWORD: ${AST_DIRECT_POSTGRES_PASSWORD:?set}
      TZ: Asia/Kolkata
    volumes:
      - ast_direct_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ast_direct

  ast-direct-migrate:
    <<: *ast-direct
    container_name: ast-direct-paper-migrate
    command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    restart: "no"
    depends_on:
      ast-direct-postgres:
        condition: service_healthy

  ast-direct-worker:
    <<: *ast-direct
    container_name: ast-direct-paper-worker
    restart: unless-stopped
    init: true
    command: ["python", "/app/worker/ast_direct_worker.py", "--mode", "PAPER"]
    stop_grace_period: 30s
    volumes:
      - ast_direct_logs:/app/logs
      - ./ast-direct-control:/app/control:ro
    healthcheck:
      test: ["CMD", "python", "/app/worker/ast_direct_worker.py", "--mode", "PAPER", "--health"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    depends_on:
      ast-direct-postgres:
        condition: service_healthy
      ast-direct-migrate:
        condition: service_completed_successfully

  # Read-only monitoring API. No env_file: it receives no broker credentials. GET only, bearer-token protected,
  # PostgreSQL transactions forced read-only, internal network only (no published port), read-only filesystem.
  ast-direct-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ast-direct-api:${AST_DIRECT_IMAGE_TAG:-local}
    container_name: ast-direct-paper-api
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    command: ["python", "-m", "app.adaptive_supertrend.direct.api"]
    environment:
      TZ: Asia/Kolkata
      PORT: "8010"
      DATABASE_URL: postgresql+psycopg://${AST_DIRECT_POSTGRES_USER:?set}:${AST_DIRECT_POSTGRES_PASSWORD:?set}@ast-direct-postgres:5432/${AST_DIRECT_POSTGRES_DB:?set}
      AST_DIRECT_CONFIG_JSON: ${AST_DIRECT_CONFIG_JSON:-}
      AST_DIRECT_ENABLED: ${AST_DIRECT_ENABLED:-false}
      AST_DIRECT_KILL_SWITCH: ${AST_DIRECT_KILL_SWITCH:-false}
      AST_DIRECT_HEARTBEAT_FILE: /app/logs/ast_direct_worker.heartbeat.json
      AST_DIRECT_KILL_SWITCH_FILE: /app/control/KILL
      AST_DIRECT_API_TOKEN_FILE: /run/ast-direct/api-token
    volumes:
      - ast_direct_logs:/app/logs:ro
      - ./ast-direct-control:/app/control:ro
      - ./ast-direct-secrets/api:/run/ast-direct:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=5).read()"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 15s
    networks:
      - ast_direct
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      ast-direct-postgres:
        condition: service_healthy

  # Next.js workspace. Browser reads go only through its server-side, allowlisted GET bridge.
  ast-direct-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
    image: ast-direct-frontend:${AST_DIRECT_IMAGE_TAG:-local}
    container_name: ast-direct-paper-frontend
    restart: unless-stopped
    init: true
    environment:
      TZ: Asia/Kolkata
      AST_DIRECT_API_ORIGIN: http://ast-direct-api:8010
      AST_DIRECT_API_TOKEN_FILE: /run/ast-direct/api-token
      AST_DIRECT_VIEWER_AUTH_SHA256_FILE: /run/ast-direct/viewer-sha256
    volumes:
      - ./ast-direct-secrets/frontend:/run/ast-direct:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ast-futures').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
    networks:
      - ast_direct
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      ast-direct-api:
        condition: service_healthy

  # Authenticated ingress (Basic auth). Opt-in profile; loopback-only HTTP by default for an SSH tunnel.
  ast-direct-ingress:
    image: caddy:2.8-alpine
    container_name: ast-direct-paper-ingress
    profiles: ["ingress"]
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${AST_DIRECT_SITE_ADDRESS:-:80}
      # Empty values make Caddy refuse to start: the ingress never runs unauthenticated.
      APP_AUTH_USER: ${AST_DIRECT_VIEWER_USER:-}
      APP_AUTH_HASH: ${AST_DIRECT_VIEWER_BCRYPT_HASH:-}
    ports:
      - "${AST_DIRECT_INGRESS_HTTP_BIND:-127.0.0.1:8088}:80"
    volumes:
      - ./Caddyfile.ast-direct:/etc/caddy/Caddyfile:ro
      - ast_direct_caddy_data:/data
    networks:
      - ast_direct
    depends_on:
      ast-direct-frontend:
        condition: service_healthy

volumes:
  ast_direct_postgres_data:
  ast_direct_logs:
  ast_direct_caddy_data:

networks:
  ast_direct:
